<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A premium, modern calculator web application with beautiful UI and smooth interactions." />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator">
    <div class="calculator__display">
      <div class="calculator__expression" aria-live="polite">
        <span id="expression" aria-label="previous calculation"></span>
        <button class="btn btn--delete" data-action="delete" aria-label="Delete last digit" tabindex="0">⌫</button>
      </div>
      <div class="calculator__result" aria-live="assertive" aria-atomic="true">
        <span id="result" aria-label="current value">0</span>
      </div>
    </div>

    <div class="calculator__buttons" role="group" aria-label="calculator buttons">
      <button class="btn btn--function" data-action="clear" aria-label="Clear all">AC</button>
      <button class="btn btn--function" data-action="negate" aria-label="Toggle positive or negative">+/−</button>
      <button class="btn btn--function" data-action="percent" aria-label="Percent">%</button>
      <button class="btn btn--operator" data-action="divide" aria-label="Divide">÷</button>

      <button class="btn btn--number" data-value="7" aria-label="Seven">7</button>
      <button class="btn btn--number" data-value="8" aria-label="Eight">8</button>
      <button class="btn btn--number" data-value="9" aria-label="Nine">9</button>
      <button class="btn btn--operator" data-action="multiply" aria-label="Multiply">×</button>

      <button class="btn btn--number" data-value="4" aria-label="Four">4</button>
      <button class="btn btn--number" data-value="5" aria-label="Five">5</button>
      <button class="btn btn--number" data-value="6" aria-label="Six">6</button>
      <button class="btn btn--operator" data-action="subtract" aria-label="Subtract">−</button>

      <button class="btn btn--number" data-value="1" aria-label="One">1</button>
      <button class="btn btn--number" data-value="2" aria-label="Two">2</button>
      <button class="btn btn--number" data-value="3" aria-label="Three">3</button>
      <button class="btn btn--operator" data-action="add" aria-label="Add">+</button>

      <button class="btn btn--number btn--span-two" data-value="0" aria-label="Zero">0</button>
      <button class="btn btn--number" data-value="." aria-label="Decimal point">.</button>
      <button class="btn btn--equals" data-action="calculate" aria-label="Calculate result">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
